{% extends "base.html" %}

{% block title %}
Races
{% endblock %}

{% block content %}

<h2 class="mb-4">Election Races</h2>

<table class="table table-striped table-hover">

    <thead>
        <tr>
            <th>Race</th>
            <th>State</th>
            <th>Office</th>
            <th>Details</th>
        </tr>
    </thead>

    <tbody>
        {% for race in races %}
        <tr>
            <td>{{ race.RaceName }}</td>
            <td>{{ race.State }}</td>
            <td>{{ race.Position }}</td>
            <td>
                <a href="/race/{{ race.RaceID }}" 
                   class="btn btn-sm btn-outline-primary">
                    View
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>

</table>

{% endblock %}
